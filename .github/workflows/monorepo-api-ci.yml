name: Reusable CI

on:
  workflow_call:
    inputs:
      global_json_path:
        description: Path to global.json for .NET SDK
        required: true
        type: string
      solution_path:
        description: Path to the .NET solution file
        required: true
        type: string
      test_project:
        description: Path to the test project csproj
        required: true
        type: string
      project_path:
        description: Path to the web project csproj (for swagger export)
        required: true
        type: string
      swagger_assembly_path:
        description: Path to the built assembly dll used by swashbuckle
        required: true
        type: string
      swagger_version:
        description: Swagger document version name (e.g., v1)
        required: false
        default: v1
        type: string
      coverage_threshold:
        description: Minimum line coverage percentage to enforce
        required: false
        default: 60
        type: number
      schema_path:
        description: Path to the JSON Schema for diff summary validation
        required: true
        type: string
      parse_script_jq:
        description: Path to jq-based parse script
        required: true
        type: string
      compare_parsers_script:
        description: Path to parser comparison script (optional)
        required: false
        default: ''
        type: string
      fixtures_path:
        description: Path to fixtures directory for parser comparison (optional)
        required: false
        default: ''
        type: string
      previous_swagger_path:
        description: Repo path to previous swagger.json to diff against (optional)
        required: false
        default: ''
        type: string
      divergence_threshold:
        description: Max allowed changeType divergence sum before failing
        required: false
        default: 15
        type: number

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_test:
    name: Build & Test (.NET)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: ${{ inputs.global_json_path }}
      - name: Restore
        run: dotnet restore "${{ inputs.solution_path }}"
      - name: Build
        run: dotnet build "${{ inputs.solution_path }}" --configuration Release --no-restore /warnaserror
      - name: Test
        run: |
          dotnet test "${{ inputs.test_project }}" --configuration Release --no-build \
            --collect:"XPlat Code Coverage" --logger "trx;LogFileName=test-results.trx"
      - name: Convert coverage to lcov
        uses: danielpalme/ReportGenerator-GitHub-Action@v5
        with:
          reports: '**/coverage.cobertura.xml'
          targetdir: 'coverage-report'
          reporttypes: 'lcov'
      - name: Enforce coverage threshold
        env:
          THRESHOLD: ${{ inputs.coverage_threshold }}
        run: |
          TOTAL_LINE_COVERED=$(grep -E 'LF:' coverage-report/lcov.info | awk -F: '{sum += $2} END {print sum}')
          TOTAL_LINE_HITS=$(grep -E 'LH:' coverage-report/lcov.info | awk -F: '{sum += $2} END {print sum}')
          if [ -z "$TOTAL_LINE_COVERED" ] || [ "$TOTAL_LINE_COVERED" -eq 0 ]; then echo "No coverage data found"; exit 1; fi
          PCT=$(awk -v h=$TOTAL_LINE_HITS -v c=$TOTAL_LINE_COVERED 'BEGIN { printf "%.2f", (h/c)*100 }')
          echo "Line coverage: $PCT% (threshold ${THRESHOLD}%)"
          awk -v p=$PCT -v t=${THRESHOLD} 'BEGIN { exit (p+0 < t) ? 1 : 0 }' || { echo "Coverage below threshold"; exit 1; }
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage-report/lcov.info
          if-no-files-found: error
          retention-days: 30
      - name: Export Swagger (OpenAPI) JSON
        run: |
          dotnet build "${{ inputs.project_path }}" -c Release --no-restore
          dotnet tool install --global swashbuckle.aspnetcore.cli --version 6.6.2 || echo "Tool already installed"
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet swagger tofile --output swagger.json "${{ inputs.swagger_assembly_path }}" "${{ inputs.swagger_version }}"
      - name: Upload Swagger artifact
        uses: actions/upload-artifact@v4
        with:
          name: swagger-v1
          path: swagger.json
          retention-days: 30

  swagger_diff:
    name: Swagger Diff + Schema Validation
    runs-on: ubuntu-latest
    needs: build_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup tools (oasdiff, jq, ajv)
        run: |
          curl -sSL https://github.com/tufin/oasdiff/releases/download/v2.10.5/oasdiff_2.10.5_linux_amd64.tar.gz | tar -xz oasdiff
          sudo mv oasdiff /usr/local/bin/oasdiff
          sudo apt-get update -y && sudo apt-get install -y jq
          npm install -g ajv-cli@5.0.0 ajv-formats@3.0.1
      - name: Download current swagger artifact
        uses: actions/download-artifact@v4
        with:
          name: swagger-v1
          path: current
      - name: Prepare previous and current specs
        env:
          PREV: ${{ inputs.previous_swagger_path }}
        run: |
          mkdir -p specs
          cp -v current/swagger.json specs/current.json
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            if [ -n "$PREV" ]; then
              git show HEAD^:"$PREV" > specs/previous.json || cp -v specs/current.json specs/previous.json
            else
              cp -v specs/current.json specs/previous.json
            fi
          else
            cp -v specs/current.json specs/previous.json
          fi
      - name: Generate structured OpenAPI diff summary (jq-based)
        run: |
          chmod +x "${{ inputs.parse_script_jq }}"
          "${{ inputs.parse_script_jq }}" specs/previous.json specs/current.json > openapi-diff-summary.json
          jq 'keys' openapi-diff-summary.json
      - name: Validate JSON shape with ajv (schema)
        run: |
          ajv validate -s "${{ inputs.schema_path }}" -d openapi-diff-summary.json --all-errors --strict=false
      - name: Upload diff summary artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-diff-summary
          path: openapi-diff-summary.json
          retention-days: 60

  parser_divergence:
    name: Parser divergence and safeguards
    runs-on: ubuntu-latest
    needs: swagger_diff
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get update -y && sudo apt-get install -y jq
      - name: Compare parsers over fixtures
        env:
          COMPARE_SCRIPT: ${{ inputs.compare_parsers_script }}
          FIXTURES: ${{ inputs.fixtures_path }}
        run: |
          if [ -n "$COMPARE_SCRIPT" ]; then
            chmod +x "$COMPARE_SCRIPT"
            if [ -n "$FIXTURES" ] && [ -d "$FIXTURES" ]; then
              "$COMPARE_SCRIPT" "$FIXTURES"
            else
              echo "No fixtures directory set; generating empty CSVs";
              echo "case,legacy,jq,match" > classification-history.csv
              echo "changeType,legacy,jq,diff" > changeType-divergence.csv
            fi
          else
            echo "No comparison script provided; generating empty CSVs";
            echo "case,legacy,jq,match" > classification-history.csv
            echo "changeType,legacy,jq,diff" > changeType-divergence.csv
          fi
      - name: Divergence safeguard
        env:
          DIVERGENCE_THRESHOLD: ${{ inputs.divergence_threshold }}
        run: |
          THRESH=${DIVERGENCE_THRESHOLD:-15}
          echo "Threshold: $THRESH"
          if [ -f changeType-divergence.csv ]; then
            TOTAL=$(awk -F, 'NR>1 { s+=($4<0?-1*$4:$4) } END { print s+0 }' changeType-divergence.csv)
            echo "Total divergence across changeTypes: $TOTAL"
            if [ "$TOTAL" -gt "$THRESH" ]; then
              echo "Divergence $TOTAL > threshold $THRESH"; exit 1;
            fi
          else
            echo "No divergence file found; skipping guard";
          fi
      - name: Upload divergence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: parser-divergence
          path: |
            classification-history.csv
            changeType-divergence.csv
          retention-days: 60
